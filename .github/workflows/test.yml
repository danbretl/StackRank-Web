name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run project verification
        run: npm run verify

      - name: Verify database security with isolated synthetic records
        run: npm run test:security:database

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/runs/**
            reports/latest
            reports/latest.txt
            reports/e2e/runs/**
            reports/e2e/latest
            reports/e2e/latest.txt
            reports/data-safety/**
            reports/security-audit-corrections/*/result.json
            reports/security-browser/**
            reports/accessibility-cdp/**
            reports/deployment-contract/**
            dist/contract/**
            dist/build-info.json
          if-no-files-found: warn
